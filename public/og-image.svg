<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0.9" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="530" x2="1200" y2="530" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>

  <!-- Container shapes -->
  <rect x="80" y="420" width="60" height="60" fill="#3B82F6" opacity="0.2" rx="4"/>
  <rect x="1060" y="150" width="60" height="60" fill="#3B82F6" opacity="0.2" rx="4"/>

  <!-- Airplane icon -->
  <g transform="translate(100, 480)">
    <path d="M12 2L4.5 20.3L5.2 21L12 18L18.8 21L19.5 20.3L12 2Z M12 5L18.5 19L12 16L5.5 19L12 5Z"
          fill="#60A5FA" opacity="0.8" transform="rotate(-45 12 12) scale(1.5)"/>
  </g>

  <!-- Ship icon -->
  <g transform="translate(1080, 180)">
    <path d="M4 18L2 20H22L20 18M6 16H18L20 18H4M12 8L16 12H8M12 4V8"
          fill="#60A5FA" opacity="0.8" transform="scale(1.5)"/>
  </g>

  <!-- Main content -->
  <g transform="translate(100, 200)">
    <!-- Company name -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="-1">
      AMIR &amp; CO
    </text>

    <!-- Accent line -->
    <rect x="0" y="20" width="140" height="4" fill="#3B82F6"/>

    <!-- Tagline -->
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#94A3B8" font-weight="300">
      Expert Freight Forwarding
    </text>
    <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#94A3B8" font-weight="300">
      &amp; Logistics Solutions
    </text>
  </g>

  <!-- Services badges -->
  <g transform="translate(100, 450)">
    <!-- Air Freight badge -->
    <rect x="0" y="0" width="140" height="40" fill="#1E40AF" rx="20" opacity="0.8"/>
    <text x="70" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">
      Air Freight
    </text>

    <!-- Sea Freight badge -->
    <rect x="160" y="0" width="150" height="40" fill="#1E40AF" rx="20" opacity="0.8"/>
    <text x="235" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">
      Sea Freight
    </text>

    <!-- Land Transport badge -->
    <rect x="330" y="0" width="180" height="40" fill="#1E40AF" rx="20" opacity="0.8"/>
    <text x="420" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">
      Land Transport
    </text>

    <!-- Customs badge -->
    <rect x="530" y="0" width="160" height="40" fill="#1E40AF" rx="20" opacity="0.8"/>
    <text x="610" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="500">
      Customs
    </text>
  </g>

  <!-- Global reach indicator -->
  <g transform="translate(850, 350)">
    <circle cx="50" cy="50" r="80" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
    <circle cx="50" cy="50" r="60" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
    <circle cx="50" cy="50" r="6" fill="#60A5FA" opacity="0.9" filter="url(#glow)"/>
    <text x="50" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle" font-weight="300">
      Global Reach
    </text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="620" width="1200" height="10" fill="#3B82F6" opacity="0.5"/>
</svg>
